<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Order Logistics Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .hidden { display: none; }
        #mapid { height: 100vh; width: 100%; }
    </style>
</head>
<body class="bg-gray-100">

    <div id="app" class="container mx-auto p-4">

        <!-- 1. Main Dashboard View -->
        <div id="dashboard-view">
            <div class="bg-white p-8 rounded-lg shadow-md text-center">
                <h1 class="text-3xl font-bold mb-6">Logistics Dashboard</h1>
                <button id="simulate-orders-btn" class="bg-blue-600 text-white px-6 py-3 rounded-lg text-lg hover:bg-blue-700 transition duration-300">
                    Simulate 100 Active Orders
                </button>
                <div class="mt-8">
                    <h2 class="text-2xl font-bold mb-4">Active Orders</h2>
                    <div id="order-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 text-center">
                        <!-- Order list will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Tracking View -->
        <div id="tracking-view" class="relative min-h-screen hidden">
            <div id="mapid" class="absolute inset-0"></div>
            <div class="absolute top-4 left-4 bg-white p-4 rounded-lg shadow-lg z-10 flex flex-col items-center">
                <button id="back-to-dashboard-btn" class="mb-4 bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition duration-300">Back to Dashboard</button>
                <p class="text-lg font-semibold">Tracking Order: <span id="tracking-order-id"></span></p>
                <p class="text-lg font-semibold">Status: <span id="order-status"></span></p>
            </div>
        </div>

    </div>

    <script>
        // --- Config ---
        const GEOAPIFY_API_KEY = '2334f4bf57624683af9b5e747e7b39a0'; // <-- IMPORTANT: REPLACE WITH YOUR KEY

        // --- State Management ---
        let allOrders = [];
        let activeSimulation = null;
        let pointsOfInterest = [];

        // --- DOM Elements ---
        const views = ['dashboard-view', 'tracking-view'];
        const simulateBtn = document.getElementById('simulate-orders-btn');
        const orderListDiv = document.getElementById('order-list');
        const backToDashboardBtn = document.getElementById('back-to-dashboard-btn');
        const trackingOrderIdSpan = document.getElementById('tracking-order-id');
        const orderStatusSpan = document.getElementById('order-status');

        // --- View Management ---
        function showView(viewId) {
            views.forEach(id => {
                document.getElementById(id).classList.toggle('hidden', id !== viewId);
            });
        }

        // --- Data Fetching ---
        async function fetchPointsOfInterest() {
            if (GEOAPIFY_API_KEY === 'YOUR_GEOAPIFY_API_KEY') {
                alert('Please replace YOUR_GEOAPIFY_API_KEY with your actual key in the script.');
                return;
            }

            try {
                simulateBtn.disabled = true;
                simulateBtn.textContent = 'Loading Locations...';

                // Step 1: Get the placeId for Lokoja
                const geocodeUrl = `https://api.geoapify.com/v1/geocode/search?text=Lokoja&type=city&apiKey=${GEOAPIFY_API_KEY}`;
                const geocodeResponse = await fetch(geocodeUrl);
                const geocodeData = await geocodeResponse.json();
                if (!geocodeData.features || geocodeData.features.length === 0) {
                    throw new Error('Could not find Lokoja. Please check the city name.');
                }
                const placeId = geocodeData.features[0].properties.place_id;
                console.log('Found Lokoja placeId:', placeId);

                // Step 2: Use the placeId to get Points of Interest
                const placesUrl = `https://api.geoapify.com/v2/places?categories=commercial,catering,tourism,accommodation,leisure,natural&filter=place:${placeId}&limit=200&apiKey=${GEOAPIFY_API_KEY}`;
                const placesResponse = await fetch(placesUrl);
                const placesData = await placesResponse.json();
                pointsOfInterest = placesData.features.map(feature => ({
                    name: feature.properties.name,
                    coords: [feature.properties.lat, feature.properties.lon]
                }));
                console.log(`Loaded ${pointsOfInterest.length} points of interest.`);
                generateOrders();

            } catch (error) {
                console.error('Error fetching points of interest:', error);
                alert('Could not fetch location data. Please check your API key and network connection.');
            } finally {
                simulateBtn.disabled = false;
                simulateBtn.textContent = 'Simulate 100 Active Orders';
            }
        }

        // --- Order Generation ---
        function generateOrders() {
            if (pointsOfInterest.length < 2) {
                alert('Not enough points of interest loaded to generate orders.');
                return;
            }
            allOrders = [];

            // 1. Create the specific first four orders
            const stadiumCoords = [7.81334, 6.69838];
            const specificDestinations = [
                { id: 'XYZ-1000', name: 'Kogi State Specialist Hospital', coords: [7.7935662111756665, 6.731518881826145] },
                { id: 'XYZ-1001', name: 'Treasures', coords: [7.794692961504175, 6.730789321006441] },
                { id: 'XYZ-1002', name: 'Edge Drive Hotel', coords: [7.8026333967069235, 6.733328041929266] },
                { id: 'XYZ-1003', name: 'Hotel Pacific', coords: [7.790236424516143, 6.724883130285108] }
            ];

            specificDestinations.forEach(dest => {
                allOrders.push({
                    id: dest.id,
                    startCoords: stadiumCoords,
                    destinationCoords: dest.coords,
                    startName: 'Confluence Stadium',
                    destName: dest.name
                });
            });

            // 2. Create a specific order for XYZ-1006
            allOrders.push({
                id: 'XYZ-1006',
                startCoords: [7.793768176080291, 6.7314652376482265],
                destinationCoords: [7.802675914720825, 6.733563976312113],
                startName: 'Specialist Hospital',
                destName: 'GTBank'
            });

            // 3. Create the remaining random orders
            for (let i = 4; i < 100; i++) {
                if (i === 6) continue; // Skip 1006 as it's already created
                const orderId = `XYZ-${String(1000 + i).padStart(4, '0')}`;
                const startPoi = pointsOfInterest[Math.floor(Math.random() * pointsOfInterest.length)];
                const destPoi = pointsOfInterest[Math.floor(Math.random() * pointsOfInterest.length)];

                allOrders.push({
                    id: orderId,
                    startCoords: startPoi.coords,
                    destinationCoords: destPoi.coords,
                    startName: startPoi.name,
                    destName: destPoi.name
                });
            }
            renderOrderList();
        }

        simulateBtn.addEventListener('click', fetchPointsOfInterest);

        function renderOrderList() {
            orderListDiv.innerHTML = '';
            allOrders.forEach(order => {
                const orderElement = document.createElement('button');
                orderElement.className = 'p-4 bg-gray-200 rounded-lg hover:bg-blue-200 text-sm';
                orderElement.textContent = order.id;
                orderElement.onclick = () => trackOrder(order.id);
                orderListDiv.appendChild(orderElement);
            });
        }

        // --- Tracking Logic ---
        let map = null;
        let driverMarker = null;

        function trackOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            showView('tracking-view');
            trackingOrderIdSpan.textContent = order.id;

            setTimeout(() => {
                initializeMap(order);
                startSimulation(order);
            }, 100);
        }

        function initializeMap(order) {
            if (map) map.remove();
            map = L.map('mapid').setView(order.destinationCoords, 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
            L.marker(order.destinationCoords).addTo(map).bindPopup(`Destination: ${order.destName || ''}`);
        }

        function startSimulation(order) {
            if (activeSimulation) clearInterval(activeSimulation.interval);

            let currentStep = 0;
            const totalSteps = 100;

            if (driverMarker) map.removeLayer(driverMarker);
            driverMarker = L.marker(order.startCoords, { icon: L.divIcon({ className: 'custom-div-icon', html: '<div class="bg-blue-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-xs font-bold">🚗</div>', iconSize: [30, 30] }) }).addTo(map);
            driverMarker.bindPopup(`Start: ${order.startName || ''}`);

            const interval = setInterval(() => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    const lat = order.startCoords[0] + (order.destinationCoords[0] - order.startCoords[0]) * (currentStep / totalSteps);
                    const lng = order.startCoords[1] + (order.destinationCoords[1] - order.startCoords[1]) * (currentStep / totalSteps);
                    const currentCoords = [lat, lng];

                    driverMarker.setLatLng(currentCoords);
                    map.panTo(currentCoords);
                    orderStatusSpan.textContent = 'En Route';
                } else {
                    clearInterval(interval);
                    orderStatusSpan.textContent = 'Delivered!';
                }
            }, 200); // Faster simulation for demo purposes

            activeSimulation = { interval, orderId: order.id };
        }

        // --- Navigation ---
        backToDashboardBtn.addEventListener('click', () => {
            if (activeSimulation) clearInterval(activeSimulation.interval);
            activeSimulation = null;
            showView('dashboard-view');
        });

    </script>
    <style>
        .custom-div-icon { background-color: transparent; border: none; }
    </style>

</body>
</html>
